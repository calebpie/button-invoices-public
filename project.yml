# XcodeGen configuration. `make generate` turns this into ButtonInvoices.xcodeproj.
# Edit this file, not the generated project (it is gitignored and overwritten).
# Reference: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md

name: ButtonInvoices

options:
  deploymentTarget:
    # SPEC.md, "Platform": iOS 18 runs on every iPhone from the XS/XR (2018) on.
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Machine-specific signing values (team ID, bundle ID prefix). Created by `make setup`.
configFiles:
  Debug: Configs/Signing.xcconfig
  Release: Configs/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  InvoiceKit:
    path: Packages/InvoiceKit

targets:
  ButtonInvoices:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
      # Layered Liquid Glass app icon (App icons): icon.json and SVG layers, editable in Icon Composer.
      - path: App/Resources/AppIcon.icon
        buildPhase: resources
      - path: App/Resources/InvoiceLogo.png
        buildPhase: resources
      # Folder reference: copied whole, so business.json is included when `make seed` made it.
      - path: App/Resources/Seed
        type: folder
        buildPhase: resources
    dependencies:
      - package: InvoiceKit
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: Button Invoices
        PRODUCT_MODULE_NAME: ButtonInvoices
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ButtonInvoices
        INFOPLIST_KEY_CFBundleDisplayName: Invoices
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Both orientations on iPhone too (Designing for iOS, "switching between landscape
        # and portrait orientations as needed").
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # A complete, active sentence saying what the camera is for (Privacy, "Requesting
        # permission").
        INFOPLIST_KEY_NSCameraUsageDescription: The app uses the camera to photograph new buttons and shipping receipts.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    # Generated by `make generate` and merged with the generated Info.plist keys.
    # Home Screen quick actions (App/Sources/ButtonInvoicesApp.swift, QuickAction).
    info:
      path: App/Info.plist
      properties:
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: NewInvoice
            UIApplicationShortcutItemTitle: New Invoice
            UIApplicationShortcutItemIconSymbolName: doc.badge.plus
          - UIApplicationShortcutItemType: NewButton
            UIApplicationShortcutItemTitle: Add a Button
            UIApplicationShortcutItemIconSymbolName: plus.circle
